name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Run deterministic end-to-end demo
        run: npm run demo

      - name: Build
        run: npm run build

      - name: Validate deployment shell
        run: bash -n infra/deploy.sh

      - name: Scan release claims and secrets
        run: node scripts/scan-release.mjs
