<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #121715; }
      body { font-family: Inter, Arial, sans-serif; color: #f4f6f4; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; container-type: size; background: #121715; }
      .clip { position: absolute; }
      .ground { inset: 0; background: #121715; }
      .grid { inset: 0; opacity: .18; background-image: linear-gradient(rgba(244,246,244,.1) 1px, transparent 1px), linear-gradient(90deg, rgba(244,246,244,.1) 1px, transparent 1px); background-size: 72px 72px; mask-image: linear-gradient(to right, black, transparent 78%); }
      .kicker { left: 112px; top: 92px; color: #9ef0ba; font: 28px/1 JetBrains Mono, monospace; letter-spacing: .16em; text-transform: uppercase; }
      .title { left: 108px; top: 190px; width: 760px; font-size: 142px; line-height: .94; letter-spacing: -.055em; font-weight: 400; }
      .title em { color: #9ef0ba; font-style: italic; }
      .lead { left: 116px; top: 530px; width: 580px; color: #dfe4e1; font-size: 31px; line-height: 1.25; }
      .index { left: 116px; bottom: 205px; color: rgba(244,246,244,.62); font: 23px/1.4 JetBrains Mono, monospace; letter-spacing: .03em; }
      .surface { left: 850px; top: 92px; width: 960px; height: 825px; overflow: hidden; border: 1px solid rgba(244,246,244,.22); border-radius: 14px; background: #001031; box-shadow: 0 18px 60px rgba(0,0,0,.34); }
      .surface::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,16,49,.06), rgba(0,16,49,.62)); pointer-events: none; }
      .surface img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; filter: saturate(.78) contrast(1.04) brightness(.82); }
      .tag { position: absolute; right: 42px; top: 40px; z-index: 2; padding: 13px 18px; border: 1px solid rgba(158,240,186,.58); border-radius: 999px; color: #9ef0ba; background: rgba(0,16,49,.78); font: 17px/1 JetBrains Mono, monospace; letter-spacing: .08em; text-transform: uppercase; }
      .line { left: 112px; top: 855px; width: 600px; height: 1px; background: rgba(158,240,186,.7); transform-origin: left; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="01-hook" data-start="0" data-duration="12.5" data-width="1920" data-height="1080">
      <div id="ground" class="clip ground" data-start="0" data-duration="12.5" data-track-index="0"></div>
      <div id="grid" class="clip grid" data-start="0" data-duration="12.5" data-track-index="1"></div>
      <div id="kicker" class="clip kicker" data-start="0" data-duration="12.5" data-track-index="2">✱ autonomous livestream operations</div>
      <div id="title" class="clip title" data-start="0" data-duration="12.5" data-track-index="3">Stay<br /><em>live.</em></div>
      <div id="lead" class="clip lead" data-start="0" data-duration="12.5" data-track-index="4">Creator Duty handles the campaign while the creator stays with the audience.</div>
      <div id="surface" class="clip surface" data-start="0" data-duration="12.5" data-track-index="5"><img src="assets/scroll-000.png" alt="Creator Duty live judging panel" /><div class="tag">synthetic judge fixture</div></div>
      <div id="line" class="clip line" data-start="0" data-duration="12.5" data-track-index="6"></div>
      <div id="index" class="clip index" data-start="0" data-duration="12.5" data-track-index="7">01 / THE HANDOFF · CREATOR DUTY BY SIGMORA</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#kicker", "#title", "#lead", "#surface", "#index"], { opacity: 0, y: 24 });
      gsap.set("#line", { scaleX: 0 });
      tl.to("#kicker", { opacity: 1, y: 0, duration: .7, ease: "power3.out" }, 0);
      tl.to("#title", { opacity: 1, y: 0, duration: 1.1, ease: "power3.out" }, .7);
      tl.to("#surface", { opacity: 1, y: 0, scale: 1.015, duration: 1.3, ease: "power3.out" }, 2.2);
      tl.to("#lead", { opacity: 1, y: 0, duration: .85, ease: "power3.out" }, 3.1);
      tl.to("#line", { scaleX: 1, duration: .8, ease: "power3.out" }, 7.4);
      tl.to("#index", { opacity: 1, y: 0, duration: .6, ease: "power3.out" }, 8.4);
      window.__timelines["01-hook"] = tl;
    </script>
  </body>
</html>
