<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #121715; }
      body { font-family: Inter, Arial, sans-serif; color: #f4f6f4; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; container-type: size; background: #121715; }
      .clip { position: absolute; }
      .ground { inset: 0; background: #121715; }
      .wash { inset: 0; background: linear-gradient(90deg, #121715 0%, rgba(18,23,21,.82) 38%, rgba(0,16,49,.48) 100%); }
      .kicker { left: 104px; top: 92px; color: #9ef0ba; font: 26px/1 JetBrains Mono, monospace; letter-spacing: .15em; text-transform: uppercase; }
      .headline { left: 102px; top: 174px; width: 680px; font-size: 88px; line-height: .98; letter-spacing: -.04em; }
      .headline strong { color: #9ef0ba; font-weight: 400; }
      .sub { left: 108px; top: 430px; width: 520px; color: #dfe4e1; font-size: 28px; line-height: 1.35; }
      .flow { left: 106px; top: 680px; display: flex; gap: 14px; align-items: center; color: rgba(244,246,244,.62); font: 20px JetBrains Mono, monospace; }
      .flow b { color: #f4f6f4; font-weight: 400; }
      .arrow { color: #9ef0ba; }
      .screen { left: 730px; top: 92px; width: 1080px; height: 855px; overflow: hidden; border: 1px solid rgba(244,246,244,.2); border-radius: 14px; background: #001031; box-shadow: 0 18px 60px rgba(0,0,0,.32); }
      .screen img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; filter: saturate(.78) contrast(1.06) brightness(.78); }
      .screen::after { content: ""; position: absolute; inset: 0; border: 18px solid rgba(0,16,49,.18); pointer-events: none; }
      .callout { right: 40px; top: 40px; position: absolute; z-index: 2; padding: 14px 18px; border-radius: 8px; color: #001031; background: #9ef0ba; font: 18px/1 JetBrains Mono, monospace; text-transform: uppercase; letter-spacing: .06em; }
      .rail { left: 108px; top: 598px; width: 500px; height: 1px; background: rgba(244,246,244,.25); transform-origin: left; }
      .rail::after { content: ""; display: block; width: 105px; height: 1px; background: #9ef0ba; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="02-plan" data-start="0" data-duration="14.62" data-width="1920" data-height="1080">
      <div id="ground" class="clip ground" data-start="0" data-duration="14.62" data-track-index="0"></div>
      <div id="wash" class="clip wash" data-start="0" data-duration="14.62" data-track-index="1"></div>
      <div id="kicker" class="clip kicker" data-start="0" data-duration="14.62" data-track-index="2">✱ bounded reasoning</div>
      <div id="headline" class="clip headline" data-start="0" data-duration="14.62" data-track-index="3">An event<br />becomes a<br /><strong>plan.</strong></div>
      <div id="sub" class="clip sub" data-start="0" data-duration="14.62" data-track-index="4">One creator. Four sandbox destinations. One video. One budget limit.</div>
      <div id="rail" class="clip rail" data-start="0" data-duration="14.62" data-track-index="5"></div>
      <div id="flow" class="clip flow" data-start="0" data-duration="14.62" data-track-index="6"><b>event</b><span class="arrow">→</span><b>Gemini plan</b><span class="arrow">→</span><span>policy</span></div>
      <div id="screen" class="clip screen" data-start="0" data-duration="14.62" data-track-index="7"><img src="assets/scroll-037.png" alt="Creator Duty event and Gemini plan" /><div class="callout">synthetic event → structured choice</div></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#kicker", "#headline", "#sub", "#flow", "#screen"], { opacity: 0, y: 26 });
      gsap.set("#rail", { scaleX: 0 });
      tl.to("#kicker", { opacity: 1, y: 0, duration: .65, ease: "power3.out" }, 0);
      tl.to("#headline", { opacity: 1, y: 0, duration: 1, ease: "power3.out" }, 1.2);
      tl.to("#screen", { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" }, 3.3);
      tl.to("#sub", { opacity: 1, y: 0, duration: .8, ease: "power3.out" }, 4.4);
      tl.to("#rail", { scaleX: 1, duration: .8, ease: "power3.out" }, 7.1);
      tl.to("#flow", { opacity: 1, y: 0, duration: .75, ease: "power3.out" }, 8.1);
      window.__timelines["02-plan"] = tl;
    </script>
  </body>
</html>
